    <!-- LÓGICA DE FIRESTORE, MAPA Y BÚSQUEDA -->
    <script type="module">
        import { db, auth } from "./js/firebase/firebase.init.js";
        import { collection, getDocs, writeBatch, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { EmailAuthProvider, reauthenticateWithCredential, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const btnLogout = document.getElementById("btnLogout");
        const loadingZones = document.getElementById("loadingZones");
        const zonesList = document.getElementById("zonesList");

        const statTotalAgencies = document.getElementById("statTotalAgencies");
        const statTotalZones = document.getElementById("statTotalZones");
        const statActiveAgencies = document.getElementById("statActiveAgencies");
        const statInactiveAgencies = document.getElementById("statInactiveAgencies");

        const searchInput = document.getElementById("searchInput");
        const filterBtns = document.querySelectorAll(".filter-btn");
        const btnExpandAll = document.getElementById("btnExpandAll");
        const btnCollapseAll = document.getElementById("btnCollapseAll");

        const btnViewAgencies = document.getElementById("btnViewAgencies");
        const btnViewZones = document.getElementById("btnViewZones");
        const btnResetMap = document.getElementById("btnResetMap");

        const massiveModal = document.getElementById("massiveModal");
        const btnOpenMassiveModal = document.getElementById("btnOpenMassiveModal");
        const btnCloseMassiveModal = document.getElementById("btnCloseMassiveModal");
        const massiveForm = document.getElementById("massiveForm");
        const sourceZoneSelect = document.getElementById("sourceZoneSelect");
        const targetZoneInput = document.getElementById("targetZoneInput");
        const adminPasswordInput = document.getElementById("adminPasswordInput");
        const massiveStatusMsg = document.getElementById("massiveStatusMsg");

        let globalAgencies = [];
        let globalZonesGrouped = {};
        let chartInstance = null;
        
        let map = null;
        let mapMarkers = [];
        let zonePolygons = [];
        let currentMapView = "agencies"; // 'agencies' o 'zones'
        let currentFilterStatus = "all";

        // Paleta de colores para las zonas
        const zoneColors = [
            '#6366f1', // Indigo
            '#06b6d4', // Cyan
            '#10b981', // Emerald
            '#f59e0b', // Amber
            '#ec4899', // Pink
            '#8b5cf6', // Violet
            '#f97316', // Orange
            '#14b8a6', // Teal
            '#3b82f6', // Blue
            '#e11d48'  // Rose
        ];

        // Inicializar Mapa Leaflet con OpenStreetMap
        function initMap() {
            map = L.map('map').setView([18.4861, -69.9312], 8);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }

        // Algoritmo Convex Hull (Envoltura Convexa) para evitar trazos con líneas cruzadas
        function getConvexHull(points) {
            if (points.length <= 2) return points;

            const pts = points.slice().sort((a, b) => a[0] !== b[0] ? a[0] - b[0] : a[1] - b[1]);
            const crossProduct = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);

            const lower = [];
            for (let p of pts) {
                while (lower.length >= 2 && crossProduct(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) {
                    lower.pop();
                }
                lower.push(p);
            }

            const upper = [];
            for (let i = pts.length - 1; i >= 0; i--) {
                let p = pts[i];
                while (upper.length >= 2 && crossProduct(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) {
                    upper.pop();
                }
                upper.push(p);
            }

            upper.pop();
            lower.pop();
            return lower.concat(upper);
        }

        // Limpieza de capas del mapa
        function clearMapLayers() {
            mapMarkers.forEach(m => map.removeLayer(m));
            zonePolygons.forEach(p => map.removeLayer(p));
            mapMarkers = [];
            zonePolygons = [];
        }

        // Helper para obtener el color asociado a una zona
        function getZoneColor(zoneName) {
            const zoneKeys = Object.keys(globalZonesGrouped);
            const index = zoneKeys.indexOf(zoneName);
            return index !== -1 ? zoneColors[index % zoneColors.length] : '#64748b';
        }

        // Renderizado general del mapa según la vista activa
        function renderMapElements() {
            if (!map) return;
            clearMapLayers();
            btnResetMap.classList.add("hidden");

            const bounds = [];
            const zoneKeys = Object.keys(globalZonesGrouped);

            const colorMap = {};
            zoneKeys.forEach((zoneName, index) => {
                colorMap[zoneName] = zoneColors[index % zoneColors.length];
            });

            if (currentMapView === "agencies") {
                // VISTA: PINES CON ÍCONO Y COLOR POR ZONA
                globalAgencies.forEach(agency => {
                    const lat = parseFloat(agency.lat || agency.latitud);
                    const lng = parseFloat(agency.lng || agency.longitud);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        const isEnabled = agency.enabled !== false;
                        const zoneName = (agency.zona || agency.region || 'Sin Zona').trim();
                        const color = colorMap[zoneName] || '#64748b';

                        const customIcon = L.divIcon({
                            className: 'custom-map-pin',
                            html: `
                                <div style="
                                    background-color: ${color};
                                    width: 30px;
                                    height: 30px;
                                    border-radius: 50% 50% 50% 0;
                                    transform: rotate(-45deg);
                                    display: flex;
                                    align-items: center;
                                    justify-content: center;
                                    border: 2px solid ${isEnabled ? '#ffffff' : '#f43f5e'};
                                    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
                                ">
                                    <i class="fa fa-store" style="
                                        transform: rotate(45deg);
                                        color: #ffffff;
                                        font-size: 11px;
                                    "></i>
                                </div>
                            `,
                            iconSize: [30, 30],
                            iconAnchor: [15, 30],
                            popupAnchor: [0, -30]
                        });

                        const marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);

                        marker.bindPopup(`
                            <div class="text-xs font-sans p-1">
                                <strong class="block text-white font-bold text-sm mb-1">${agency.idReal || agency.nombre || agency.id}</strong>
                                <div class="flex items-center gap-1.5 mb-1">
                                    <span class="w-2.5 h-2.5 rounded-full inline-block" style="background-color: ${color}"></span>
                                    <span class="text-slate-300 font-semibold">${zoneName}</span>
                                </div>
                                <span class="text-slate-400 font-mono text-[10px]">Dirección: ${agency.direccion || 'N/A'}</span>
                            </div>
                        `);

                        mapMarkers.push(marker);
                        bounds.push([lat, lng]);
                    }
                });
            } else {
                // VISTA: POLÍGONOS PERIMETRALES LIMPIOS POR ZONA (CONVEX HULL)
                zoneKeys.forEach((zoneName) => {
                    const list = globalZonesGrouped[zoneName];
                    const rawCoords = [];
                    const color = colorMap[zoneName];

                    list.forEach(agency => {
                        const lat = parseFloat(agency.lat || agency.latitud);
                        const lng = parseFloat(agency.lng || agency.longitud);
                        if (!isNaN(lat) && !isNaN(lng)) {
                            rawCoords.push([lat, lng]);
                            bounds.push([lat, lng]);
                        }
                    });

                    if (rawCoords.length > 0) {
                        if (rawCoords.length <= 2) {
                            rawCoords.forEach(pt => {
                                const circle = L.circle(pt, {
                                    radius: 2000,
                                    color: color,
                                    fillColor: color,
                                    fillOpacity: 0.25,
                                    weight: 1.5
                                }).addTo(map);

                                circle.bindPopup(`<strong class="text-white text-xs">${zoneName}</strong>`);
                                zonePolygons.push(circle);
                            });
                        } else {
                            const hullCoords = getConvexHull(rawCoords);
                            const polygon = L.polygon(hullCoords, {
                                color: color,
                                fillColor: color,
                                fillOpacity: 0.25,
                                weight: 2.5
                            }).addTo(map);

                            polygon.bindPopup(`<strong class="text-white">${zoneName}</strong><br><span class="text-xs text-slate-300">${rawCoords.length} Agencias en esta área</span>`);
                            zonePolygons.push(polygon);
                        }
                    }
                });
            }

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [30, 30] });
            }
        }

        // FUNCIÓN CLAVE: Limpia el mapa por completo y dibuja EXCLUSIVAMENTE la agencia seleccionada
        window.focusAgencyOnMap = function(agencyId) {
            const agency = globalAgencies.find(a => a.id === agencyId);
            if (!agency) return;

            const lat = parseFloat(agency.lat || agency.latitud);
            const lng = parseFloat(agency.lng || agency.longitud);

            if (isNaN(lat) || isNaN(lng)) return;

            // 1. Limpia todo el mapa
            clearMapLayers();

            const isEnabled = agency.enabled !== false;
            const zoneName = (agency.zona || agency.region || 'Sin Zona').trim();
            const color = getZoneColor(zoneName);

            // 2. Crea únicamente el marcador de esta agencia
            const customIcon = L.divIcon({
                className: 'custom-map-pin',
                html: `
                    <div style="
                        background-color: ${color};
                        width: 36px;
                        height: 36px;
                        border-radius: 50% 50% 50% 0;
                        transform: rotate(-45deg);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        border: 3px solid ${isEnabled ? '#ffffff' : '#f43f5e'};
                        box-shadow: 0 6px 16px rgba(0,0,0,0.7);
                    ">
                        <i class="fa fa-store" style="
                            transform: rotate(45deg);
                            color: #ffffff;
                            font-size: 14px;
                        "></i>
                    </div>
                `,
                iconSize: [36, 36],
                iconAnchor: [18, 36],
                popupAnchor: [0, -36]
            });

            const marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);

            marker.bindPopup(`
                <div class="text-xs font-sans p-1">
                    <strong class="block text-white font-bold text-sm mb-1">${agency.idReal || agency.nombre || agency.id}</strong>
                    <div class="flex items-center gap-1.5 mb-1">
                        <span class="w-2.5 h-2.5 rounded-full inline-block" style="background-color: ${color}"></span>
                        <span class="text-slate-300 font-semibold">${zoneName}</span>
                    </div>
                    <span class="text-slate-400 font-mono text-[10px]">Dirección: ${agency.direccion || 'N/A'}</span>
                </div>
            `).openPopup();

            mapMarkers.push(marker);

            // 3. Desplaza el mapa hacia la ubicación focalizada
            map.flyTo([lat, lng], 16, { duration: 1.2 });

            // 4. Muestra el botón para restablecer la vista general del mapa
            btnResetMap.classList.remove("hidden");

            // Scroll suave hacia el contenedor del mapa para mejor visibilidad
            document.getElementById("map").scrollIntoView({ behavior: 'smooth', block: 'center' });
        };

        // Eventos del conmutador y de restablecer el mapa
        btnResetMap.addEventListener("click", () => {
            renderMapElements();
        });

        btnViewAgencies.addEventListener("click", () => {
            currentMapView = "agencies";
            btnViewAgencies.classList.add("bg-indigo-600", "text-white");
            btnViewAgencies.classList.remove("text-slate-400");
            btnViewZones.classList.remove("bg-indigo-600", "text-white");
            btnViewZones.classList.add("text-slate-400");
            renderMapElements();
        });

        btnViewZones.addEventListener("click", () => {
            currentMapView = "zones";
            btnViewZones.classList.add("bg-indigo-600", "text-white");
            btnViewZones.classList.remove("text-slate-400");
            btnViewAgencies.classList.remove("bg-indigo-600", "text-white");
            btnViewAgencies.classList.add("text-slate-400");
            renderMapElements();
        });

        btnLogout.addEventListener("click", async () => {
            await signOut(auth);
            window.location.href = "login.html";
        });

        // Carga de datos Firestore
        async function loadZonesData() {
            try {
                loadingZones.style.display = "block";
                zonesList.innerHTML = "";

                const snapshot = await getDocs(collection(db, "agencias"));
                globalAgencies = [];

                snapshot.forEach((docSnap) => {
                    globalAgencies.push({ id: docSnap.id, ...docSnap.data() });
                });

                processAndRender();
                renderMapElements();
            } catch (error) {
                console.error("Error al cargar agencias:", error);
                zonesList.innerHTML = `
                    <div class="text-center py-8 text-rose-400 font-semibold text-xs bg-slate-900/40 rounded-3xl border border-rose-500/20">
                        <i class="fa fa-exclamation-triangle text-xl mb-2"></i>
                        <p>Error de lectura: ${error.message}</p>
                    </div>
                `;
            } finally {
                loadingZones.style.display = "none";
            }
        }

        function processAndRender() {
            let activeCount = 0;
            let inactiveCount = 0;
            globalZonesGrouped = {};

            const searchTerm = searchInput.value.toLowerCase().trim();

            globalAgencies.forEach((agency) => {
                const isEnabled = agency.enabled !== false;
                if (isEnabled) activeCount++;
                else inactiveCount++;

                if (currentFilterStatus === "active" && !isEnabled) return;
                if (currentFilterStatus === "inactive" && isEnabled) return;

                const name = (agency.idReal || agency.nombre || agency.id || "").toLowerCase();
                const code = (agency.direccion || agency.codigo || "").toLowerCase();
                if (searchTerm && !name.includes(searchTerm) && !code.includes(searchTerm)) return;

                const zoneName = (agency.zona || agency.region || "Sin Zona").trim();
                if (!globalZonesGrouped[zoneName]) globalZonesGrouped[zoneName] = [];
                globalZonesGrouped[zoneName].push(agency);
            });

            statTotalAgencies.innerText = globalAgencies.length;
            statTotalZones.innerText = Object.keys(globalZonesGrouped).length;
            statActiveAgencies.innerText = activeCount;
            statInactiveAgencies.innerText = inactiveCount;

            populateSourceSelect(Object.keys(globalZonesGrouped));
            renderChart(globalZonesGrouped);
            renderAccordion(globalZonesGrouped);
        }

        function populateSourceSelect(zones) {
            sourceZoneSelect.innerHTML = zones.map(z => `<option value="${z}">${z} (${globalZonesGrouped[z].length} agencias)</option>`).join("");
        }

        function renderChart(zonesGrouped) {
            const ctx = document.getElementById('zonesChart').getContext('2d');
            const labels = Object.keys(zonesGrouped);
            const dataCounts = labels.map(l => zonesGrouped[l].length);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataCounts,
                        backgroundColor: zoneColors,
                        borderWidth: 2,
                        borderColor: '#0f172a'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 10, weight: '600' }, boxWidth: 10, usePointStyle: true }
                        }
                    },
                    cutout: '75%'
                }
            });
        }

        function renderAccordion(zonesGrouped) {
            zonesList.innerHTML = "";
            const zoneKeys = Object.keys(zonesGrouped);

            if (zoneKeys.length === 0) {
                zonesList.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs bg-slate-900/30 rounded-3xl border border-slate-800">No hay agencias que coincidan con los filtros aplicados.</div>`;
                return;
            }

            zoneKeys.forEach((zoneName) => {
                const list = zonesGrouped[zoneName];
                const activeInZone = list.filter(a => a.enabled !== false).length;

                const card = document.createElement("div");
                card.className = "zone-accordion-card bg-slate-900/40 border border-slate-800 rounded-3xl overflow-hidden transition-all hover:border-slate-700/80";

                const itemsHtml = list.map(agency => {
                    const isEnabled = agency.enabled !== false;
                    const name = agency.idReal || agency.nombre || "Sin nombre";
                    const code = agency.direccion || agency.codigo || "Sin dirección";
                    const lat = agency.lat || agency.latitud;
                    const lng = agency.lng || agency.longitud;
                    const address = agency.direccion || agency.address;

                    let mapUrl = lat && lng ? `https://www.google.com/maps?q=${lat},${lng}` : address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}` : null;

                    return `
                        <div class="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800/80 flex items-center justify-between gap-3 hover:border-indigo-500/30 transition-all">
                            <div class="flex items-center gap-3 min-w-0">
                                <div class="w-8 h-8 rounded-xl bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-xs shrink-0 border border-slate-700/50">
                                    ${name.charAt(0).toUpperCase()}
                                </div>
                                <div class="min-w-0">
                                    <h4 class="font-bold text-xs text-slate-200 truncate">${name}</h4>
                                    <p class="text-[10px] font-mono text-slate-500 truncate">Dirección: ${code}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-md ${isEnabled ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}">
                                    ${isEnabled ? 'Activa' : 'Inactiva'}
                                </span>
                                ${lat && lng ? `
                                    <button onclick="focusAgencyOnMap('${agency.id}')" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-indigo-600 text-slate-400 hover:text-white flex items-center justify-center transition-all border border-slate-700/50" title="Ver únicamente esta agencia en el mapa">
                                        <i class="fa fa-crosshairs text-xs"></i>
                                    </button>
                                ` : ''}
                                ${mapUrl ? `
                                    <a href="${mapUrl}" target="_blank" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-all border border-slate-700/50" title="Abrir en Google Maps">
                                        <i class="fa fa-arrow-up-right-from-square text-[10px]"></i>
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join("");

                card.innerHTML = `
                    <button class="accordion-header w-full p-5 flex items-center justify-between gap-4 text-left focus:outline-none bg-slate-900/60 hover:bg-slate-800/50 transition-all">
                        <div class="flex items-center gap-3.5">
                            <div class="w-9 h-9 rounded-2xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-sm font-bold border border-indigo-500/20 shrink-0">
                                <i class="fa fa-layer-group"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-sm text-white">${zoneName}</h3>
                                <p class="text-[11px] text-slate-400 font-medium">${list.length} Agencias (${activeInZone} Habilitadas)</p>
                            </div>
                        </div>
                        <i class="fa fa-chevron-down text-slate-500 text-xs transition-transform duration-300 accordion-arrow"></i>
                    </button>
                    <div class="accordion-content hidden px-5 pb-5 pt-1 space-y-2.5 border-t border-slate-800/60 bg-slate-950/40">
                        ${itemsHtml}
                    </div>
                `;

                const header = card.querySelector(".accordion-header");
                const content = card.querySelector(".accordion-content");
                const arrow = card.querySelector(".accordion-arrow");

                header.addEventListener("click", () => {
                    const isHidden = content.classList.contains("hidden");
                    if (isHidden) {
                        content.classList.remove("hidden");
                        arrow.classList.add("rotate-180");
                    } else {
                        content.classList.add("hidden");
                        arrow.classList.remove("rotate-180");
                    }
                });

                zonesList.appendChild(card);
            });
        }

        // Filtros y Búsqueda
        searchInput.addEventListener("input", () => {
            processAndRender();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener("click", (e) => {
                filterBtns.forEach(b => {
                    b.classList.remove("bg-indigo-600", "text-white");
                    b.classList.add("text-slate-400");
                });
                btn.classList.add("bg-indigo-600", "text-white");
                btn.classList.remove("text-slate-400");

                currentFilterStatus = btn.dataset.filter;
                processAndRender();
            });
        });

        // Controles de Acordeón Masivo
        btnExpandAll.addEventListener("click", () => {
            document.querySelectorAll(".accordion-content").forEach(el => el.classList.remove("hidden"));
            document.querySelectorAll(".accordion-arrow").forEach(el => el.classList.add("rotate-180"));
        });

        btnCollapseAll.addEventListener("click", () => {
            document.querySelectorAll(".accordion-content").forEach(el => el.classList.add("hidden"));
            document.querySelectorAll(".accordion-arrow").forEach(el => el.classList.remove("rotate-180"));
        });

        // Modal de Reasignación Masiva
        btnOpenMassiveModal.addEventListener("click", () => {
            massiveModal.classList.remove("hidden");
        });

        btnCloseMassiveModal.addEventListener("click", () => {
            massiveModal.classList.add("hidden");
            massiveForm.reset();
            massiveStatusMsg.classList.add("hidden");
        });

        massiveForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const sourceZone = sourceZoneSelect.value;
            const targetZone = targetZoneInput.value.trim();
            const password = adminPasswordInput.value;

            if (!sourceZone || !targetZone || !password) return;

            try {
                massiveStatusMsg.innerText = "Autenticando y actualizando...";
                massiveStatusMsg.className = "text-xs font-bold text-center text-indigo-400 block py-1";

                const user = auth.currentUser;
                const credential = EmailAuthProvider.credential(user.email, password);
                await reauthenticateWithCredential(user, credential);

                const agenciesToUpdate = globalAgencies.filter(a => (a.zona || a.region || "Sin Zona").trim() === sourceZone);
                const batch = writeBatch(db);

                agenciesToUpdate.forEach(agency => {
                    const ref = doc(db, "agencias", agency.id);
                    batch.update(ref, { zona: targetZone });
                });

                await batch.commit();

                massiveStatusMsg.innerText = "¡Zonas reasignadas exitosamente!";
                massiveStatusMsg.className = "text-xs font-bold text-center text-emerald-400 block py-1";

                setTimeout(() => {
                    massiveModal.classList.add("hidden");
                    massiveForm.reset();
                    massiveStatusMsg.classList.add("hidden");
                    loadZonesData();
                }, 1500);

            } catch (error) {
                console.error("Error en cambio masivo:", error);
                massiveStatusMsg.innerText = "Error: Contraseña incorrecta o fallo de red.";
                massiveStatusMsg.className = "text-xs font-bold text-center text-rose-400 block py-1";
            }
        });

        // Inicialización al cargar el DOM
        document.addEventListener("DOMContentLoaded", () => {
            initMap();
            loadZonesData();
        });
    </script>
</body>

</html>
