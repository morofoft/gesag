<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-200">

    <div class="max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-8">
        
        <!-- ENCABEZADO -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight flex items-center gap-3">
                    <i class="fa-solid fa-users-gear text-indigo-500"></i>
                    Gestión de Usuarios
                </h1>
                <p class="text-sm text-slate-400 mt-1">Crea, activa o inhabilita cuentas de acceso al sistema.</p>
            </div>
            <div id="admin-status" class="flex items-center gap-3 bg-slate-900/80 border border-slate-800 px-4 py-2 rounded-xl text-xs">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="admin-email" class="font-mono text-slate-300">Cargando sesión...</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- FORMULARIO DE REGISTRO -->
            <div class="lg:col-span-5 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-sm self-start">
                <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-indigo-400"></i>
                    Registrar Nuevo Usuario
                </h2>

                <form id="create-user-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Nombre de Usuario</label>
                        <input type="text" id="reg-username" required placeholder="ej. mmontero"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Correo Electrónico</label>
                        <input type="email" id="reg-email" required placeholder="usuario@correo.com"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Contraseña Inicial</label>
                        <input type="password" id="reg-password" required placeholder="••••••••" minlength="6"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    </div>

                    <div id="form-message" class="hidden text-xs p-3 rounded-xl"></div>

                    <button type="submit" id="btn-submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-indigo-600/20 transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-plus"></i>
                        <span>Crear Usuario</span>
                    </button>
                </form>
            </div>

            <!-- LISTADO DE USUARIOS -->
            <div class="lg:col-span-7 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-list text-indigo-400"></i>
                        Usuarios Registrados
                    </h2>
                    <span id="user-count" class="text-xs font-mono bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/50">0 usuarios</span>
                </div>

                <!-- LISTA -->
                <div id="users-list" class="space-y-3 max-h-[500px] overflow-y-auto pr-1 custom-scrollbar">
                    <div class="text-center py-8 text-slate-500 text-sm">Cargando usuarios...</div>
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT FIREBASE SECUNDARIO -->
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            query, 
            orderBy, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. CONFIGURACIÓN DE FIREBASE (Reemplaza con tus llaves)
        const firebaseConfig = {
    apiKey: "AIzaSyA9wJ-vgcwG-MJ6gqQz3byolJP6DwrjnVw",
    authDomain: "agencias-v2.firebaseapp.com",
    projectId: "agencias-v2",
    storageBucket: "agencias-v2.firebasestorage.app",
    messagingSenderId: "896099760213",
    appId: "1:896099760213:web:969ffa8363d51c0a8bbcdc"
};

        // App Principal (Admin activo)
        const mainApp = initializeApp(firebaseConfig);
        const auth = getAuth(mainApp);
        const db = getFirestore(mainApp);

        // App Secundaria (Para crear usuarios sin desloguear al admin)
        const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
        const secondaryAuth = getAuth(secondaryApp);

        // UI Elements
        const createUserForm = document.getElementById('create-user-form');
        const usersList = document.getElementById('users-list');
        const adminEmailDisplay = document.getElementById('admin-email');
        const formMessage = document.getElementById('form-message');
        const userCount = document.getElementById('user-count');

        // 2. MONITOREAR SESIÓN DE ADMIN
        onAuthStateChanged(auth, (user) => {
            if (user) {
                adminEmailDisplay.textContent = user.email;
            } else {
                adminEmailDisplay.textContent = "No autenticado";
            }
        });

        // 3. REGISTRAR NUEVO USUARIO
        createUserForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const submitBtn = document.getElementById('btn-submit');

            try {
                setLoading(true);
                showMessage("", "clear");

                // Crear usuario en Auth usando la app secundaria
                const userCredential = await createUserWithEmailAndPassword(secondaryAuth, email, password);
                const newUser = userCredential.user;

                // Cerrar sesión en la app secundaria de inmediato para mantenerla limpia
                await secondaryAuth.signOut();

                // Guardar información extendida en Firestore usando la app principal
                await setDoc(doc(db, "users", newUser.uid), {
                    username: username,
                    email: email,
                    enabled: true,
                    createdAt: serverTimestamp()
                });

                showMessage("Usuario creado exitosamente.", "success");
                createUserForm.reset();

            } catch (error) {
                console.error("Error al crear usuario:", error);
                let msg = "Ocurrió un error al registrar el usuario.";
                if (error.code === 'auth/email-already-in-use') msg = "El correo ya está registrado.";
                if (error.code === 'auth/weak-password') msg = "La contraseña debe tener al menos 6 caracteres.";
                showMessage(msg, "error");
            } finally {
                setLoading(false);
            }
        });

        // 4. SUSCRIPCIÓN EN TIEMPO REAL A FIRESTORE
        const usersQuery = query(collection(db, "users"), orderBy("createdAt", "desc"));

        onSnapshot(usersQuery, (snapshot) => {
            usersList.innerHTML = "";
            userCount.textContent = `${snapshot.size} usuario(s)`;

            if (snapshot.empty) {
                usersList.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">No hay usuarios registrados.</div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const userId = docSnap.id;
                usersList.appendChild(createUserCard(userId, data));
            });
        });

        // 5. HELPER: CREAR ELEMENTO DOM PARA CADA USUARIO
        function createUserCard(id, data) {
            const card = document.createElement('div');
            card.className = "flex items-center justify-between p-3.5 bg-slate-950/60 border border-slate-800/80 rounded-xl hover:border-slate-700/80 transition gap-4";

            const isEnabled = data.enabled !== false;
            const displayName = data.username || "Sin Nombre";
            const email = data.email || "Sin correo";

            card.innerHTML = `
                <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2">
                        <h3 class="font-bold text-sm text-slate-100 truncate">${displayName}</h3>
                        
                        <!-- BADGE ESTADO -->
                        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider ${
                            isEnabled 
                                ? 'bg-emerald-500/10 text-emerald-400 ring-1 ring-inset ring-emerald-500/20' 
                                : 'bg-rose-500/10 text-rose-400 ring-1 ring-inset ring-rose-500/20'
                        }">
                            <span class="w-1.5 h-1.5 rounded-full ${isEnabled ? 'bg-emerald-400' : 'bg-rose-400'}"></span>
                            ${isEnabled ? 'Activo' : 'Inactivo'}
                        </span>
                    </div>

                    <p class="text-xs text-slate-400 truncate mt-0.5">${email}</p>

                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-[10px] font-mono text-slate-500 bg-slate-900 border border-slate-800 px-1.5 py-0.5 rounded">
                            ID: ${id}
                        </span>
                    </div>
                </div>

                <!-- ACCIONES -->
                <div class="flex items-center gap-2">
                    <button data-action="toggle" data-id="${id}" data-status="${isEnabled}" 
                        title="${isEnabled ? 'Inhabilitar' : 'Habilitar'}"
                        class="p-2 rounded-lg border text-xs transition ${
                            isEnabled 
                                ? 'bg-amber-500/10 border-amber-500/20 text-amber-400 hover:bg-amber-500/20' 
                                : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400 hover:bg-emerald-500/20'
                        }">
                        <i class="fa-solid ${isEnabled ? 'fa-user-slash' : 'fa-user-check'}"></i>
                    </button>

                    <button data-action="delete" data-id="${id}" title="Eliminar de Firestore"
                        class="p-2 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 text-xs transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `;

            // EVENTOS DE BOTONES
            card.querySelector('[data-action="toggle"]').addEventListener('click', () => toggleUserStatus(id, isEnabled));
            card.querySelector('[data-action="delete"]').addEventListener('click', () => deleteUserRecord(id));

            return card;
        }

        // 6. CAMBIAR ESTADO (HABILITAR / INHABILITAR)
        async function toggleUserStatus(uid, currentStatus) {
            try {
                await updateDoc(doc(db, "users", uid), {
                    enabled: !currentStatus
                });
            } catch (error) {
                console.error("Error al cambiar estado:", error);
                alert("No se pudo cambiar el estado del usuario.");
            }
        }

        // 7. ELIMINAR DOCUMENTO EN FIRESTORE
        async function deleteUserRecord(uid) {
            if (!confirm("¿Seguro que deseas eliminar el registro de Firestore? (Nota: El usuario en Auth seguirá existiendo).")) return;
            
            try {
                await deleteDoc(doc(db, "users", uid));
            } catch (error) {
                console.error("Error al eliminar registro:", error);
                alert("Error al intentar eliminar el registro.");
            }
        }

        // UI UTILS
        function setLoading(loading) {
            const btn = document.getElementById('btn-submit');
            btn.disabled = loading;
            btn.style.opacity = loading ? "0.6" : "1";
            btn.querySelector('span').textContent = loading ? "Creando..." : "Crear Usuario";
        }

        function showMessage(msg, type) {
            if (type === "clear") {
                formMessage.className = "hidden text-xs p-3 rounded-xl";
                formMessage.textContent = "";
                return;
            }
            formMessage.classList.remove("hidden");
            if (type === "success") {
                formMessage.className = "text-xs p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400";
            } else {
                formMessage.className = "text-xs p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400";
            }
            formMessage.textContent = msg;
        }
    </script>
</body>
</html>
