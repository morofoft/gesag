<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en construcción</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }

        /* Movimiento de la posición del degradado */
        @keyframes gradient-shift {
            0% { stop-color: #ff007f; }
            20% { stop-color: #7f00ff; }
            40% { stop-color: #00d4ff; }
            60% { stop-color: #00ff88; }
            80% { stop-color: #ffea00; }
            100% { stop-color: #ff007f; }
        }

        @keyframes gradient-shift-2 {
            0% { stop-color: #00d4ff; }
            20% { stop-color: #00ff88; }
            40% { stop-color: #ffea00; }
            60% { stop-color: #ff007f; }
            80% { stop-color: #7f00ff; }
            100% { stop-color: #00d4ff; }
        }

        .stop-1 { animation: gradient-shift 4s ease-in-out infinite; }
        .stop-2 { animation: gradient-shift-2 4s ease-in-out infinite; }

        /* Resplandor neón pulsante */
        @keyframes neon-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.6)) 
                        drop-shadow(0 0 25px rgba(255, 0, 127, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.8)) 
                        drop-shadow(0 0 40px rgba(127, 0, 255, 0.6));
            }
        }

        .neon-logo {
            animation: neon-pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col items-center justify-center p-6 text-center select-none overflow-hidden relative">

    <!-- Luz de fondo decorativa -->
    <div class="absolute w-96 h-96 bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <main class="flex flex-col items-center gap-6 relative z-10 max-w-md w-full">
        
        <!-- Monograma SVG estilo Neón -->
        <svg class="w-28 h-36 neon-logo" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="neonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop class="stop-1" offset="0%" />
                    <stop class="stop-2" offset="100%" />
                </linearGradient>
            </defs>

            <!-- P & G -->
            <g fill="url(#neonGradient)">
                <!-- P -->
                <rect x="0" y="0" width="18" height="130" rx="4" />
                <rect x="26" y="0" width="18" height="70" rx="4" />
                
                <!-- G -->
                <rect x="52" y="0" width="18" height="130" rx="4" />
                <rect x="78" y="0" width="18" height="38" rx="4" />
                <rect x="78" y="68" width="18" height="62" rx="4" />
            </g>
        </svg>

        <!-- Texto de estado -->
        <div class="space-y-2">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-100 tracking-tight">
                Sitio en construcción
            </h1>
            <h6 class="font-mono-code text-xs text-slate-400 bg-slate-900/80 px-3 py-1 rounded-full border border-slate-800 inline-block">
                Dev. Pedro Garcia Ramirez V2.1
            </h6>
        </div>

        <!-- Botón Grande de Ir a Inicio -->
        <a href="index.html" 
           class="w-full sm:w-auto px-8 py-4 mt-2 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-lg rounded-2xl transition-all shadow-lg shadow-emerald-600/30 hover:shadow-emerald-500/50 active:scale-95 flex items-center justify-center gap-3 border border-emerald-400/30">
            <i class="fa-solid fa-house text-xl"></i>
            <span>Ir al Inicio</span>
        </a>

    </main>

</body>
</html>
