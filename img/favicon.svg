<svg class="w-12 h-16 animate-pulse drop-shadow-[0_0_10px_rgba(99,102,241,0.6)]" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
        <linearGradient id="animatedGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#6366f1">
                <animate attributeName="stop-color" values="#6366f1; #a855f7; #3b82f6; #6366f1" dur="4s" repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#4f46e5">
                <animate attributeName="stop-color" values="#4f46e5; #ec4899; #6366f1; #4f46e5" dur="4s" repeatCount="indefinite" />
            </stop>
        </linearGradient>
    </defs>
    <!-- P & G -->
    <g fill="url(#animatedGradient)">
        <!-- P -->
        <rect x="0" y="0" width="18" height="130" rx="4" />
        <rect x="26" y="0" width="18" height="70" rx="4" />
        <!-- G -->
        <rect x="52" y="0" width="18" height="130" rx="4" />
        <rect x="78" y="0" width="18" height="38" rx="4" />
        <rect x="78" y="68" width="18" height="62" rx="4" />
    </g>
</svg>