<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">
    <title>Módulo en Construcción - AGENCYPRO</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }

        /* Movimiento de la posición del degradado */
        @keyframes gradient-shift {
            0%   { stop-color: #ff007f; }
            20%  { stop-color: #7f00ff; }
            40%  { stop-color: #00d4ff; }
            60%  { stop-color: #00ff88; }
            80%  { stop-color: #ffea00; }
            100% { stop-color: #ff007f; }
        }

        @keyframes gradient-shift-2 {
            0%   { stop-color: #00d4ff; }
            20%  { stop-color: #00ff88; }
            40%  { stop-color: #ffea00; }
            60%  { stop-color: #ff007f; }
            80%  { stop-color: #7f00ff; }
            100% { stop-color: #00d4ff; }
        }

        .stop-1 { animation: gradient-shift 4s ease-in-out infinite; }
        .stop-2 { animation: gradient-shift-2 4s ease-in-out infinite; }

        /* Resplandor neón pulsante */
        @keyframes neon-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.6))
                        drop-shadow(0 0 25px rgba(255, 0, 127, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.8))
                        drop-shadow(0 0 40px rgba(127, 0, 255, 0.6));
            }
        }

        .neon-logo { animation: neon-pulse 3s ease-in-out infinite; }

        /* Accesibilidad: deshabilitar animaciones si el usuario lo pide */
        @media (prefers-reduced-motion: reduce) {
            .stop-1, .stop-2, .neon-logo {
                animation: none !important;
            }
            .stop-1 { stop-color: #6366f1; }
            .stop-2 { stop-color: #8b5cf6; }
        }
    </style>
</head>

<body class="bg-slate-950 min-h-screen flex flex-col items-center justify-center p-6 text-center select-none relative overflow-hidden">

    <!-- Luz de fondo decorativa -->
    <div class="absolute w-96 h-96 bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute w-80 h-80 bg-emerald-600/5 rounded-full blur-[100px] pointer-events-none"></div>

    <main class="flex flex-col items-center gap-6 relative z-10 max-w-md w-full py-8">

        <!-- Monograma SVG estilo Neón -->
        <svg class="w-28 h-36 neon-logo" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <linearGradient id="neonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop class="stop-1" offset="0%" />
                    <stop class="stop-2" offset="100%" />
                </linearGradient>
            </defs>

            <!-- P & G -->
            <g fill="url(#neonGradient)">
                <!-- P -->
                <rect x="0" y="0" width="18" height="130" rx="4" />
                <rect x="26" y="0" width="18" height="70" rx="4" />

                <!-- G -->
                <rect x="52" y="0" width="18" height="130" rx="4" />
                <rect x="78" y="0" width="18" height="38" rx="4" />
                <rect x="78" y="68" width="18" height="62" rx="4" />
            </g>
        </svg>

        <!-- Texto de estado -->
        <div class="space-y-3">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-100 tracking-tight">
                Módulo en construcción
            </h1>
            <p class="text-slate-400 text-sm max-w-xs mx-auto leading-relaxed">
                Esta sección estará disponible en una próxima versión del sistema.
            </p>
            <h6 class="font-mono-code text-xs text-slate-500 bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-800 inline-block">
                Dev. Pedro Garcia Ramirez V2.1
            </h6>
        </div>

        <!-- Botones de acción -->
        <div class="w-full space-y-3 mt-2">
            <a href="index.html"
               class="w-full px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-base rounded-2xl transition-all shadow-lg shadow-emerald-600/30 hover:shadow-emerald-500/50 active:scale-95 flex items-center justify-center gap-3 border border-emerald-400/30">
                <i class="fa-solid fa-house text-lg" aria-hidden="true"></i>
                <span>Ir al Inicio</span>
            </a>

            <a href="sugerencias.html"
               class="w-full px-6 py-3 bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white font-bold text-sm rounded-2xl transition-all border border-slate-800 hover:border-slate-700 flex items-center justify-center gap-2">
                <i class="fa-solid fa-lightbulb text-amber-400" aria-hidden="true"></i>
                <span>Sugerir qué construir aquí</span>
            </a>
        </div>

        <!-- Footer discreto -->
        <p class="text-[10px] text-slate-600 font-mono-code mt-4">
            &copy; 2026 AGENCYPRO
        </p>

    </main>

</body>
</html>
